<mat-card class="article-card">
  <mat-card-content>
    <div class="title-row">
      <h2 class="title">{{ article.title }}</h2>
      @if (article.category) {
      <mat-chip-set>
        <mat-chip>{{ article.category }}</mat-chip>
      </mat-chip-set>
      }
    </div>
    <p class="excerpt">{{ getExcerpt(article.content) }}</p>
  </mat-card-content>

  <mat-card-footer class="footer">
    <span class="date"> 📅 {{ getLocalDate(article.publishedDate) }} </span>
    <a mat-button color="primary" [routerLink]="['/articles', article.id]">
      Read More
      <mat-icon>arrow_forward</mat-icon>
    </a>
  </mat-card-footer>
</mat-card>
